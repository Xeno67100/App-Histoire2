name: Construire l'APK
on: [push, workflow_dispatch]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install -g cordova@12
      - name: Preparer
        run: |
          cordova create build com.atelier.planches "Atelier BD"
          rm -rf build/www && mkdir build/www
          cp index.html icon-192.png icon-512.png build/www/
          cp config.xml build/config.xml
      - name: Compiler
        working-directory: build
        run: |
          cordova platform add android@13
          cordova build android
      - name: Recuperer
        run: |
          mkdir sortie
          find build -name "*.apk" -exec cp {} sortie/atelier-bd.apk \;
      - uses: actions/upload-artifact@v4
        with:
          name: atelier-bd-apk
          path: sortie/atelier-bd.apk
